<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Progress List - Demo View</title>    <style>        :root {            --bg-dark: #0f111a;            --bg-card: #161925;            --bg-input: #1a1d2c;            --text-main: #ffffff;            --text-muted: #8b949e;            --accent-green: #10b981;            --accent-orange: #f97316;            --accent-purple: #a855f7;            --star-gold: #eab308;        }        * {            box-sizing: border-box;            margin: 0;            padding: 0;            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;        }        body {            background-color: var(--bg-dark);            color: var(--text-main);            min-height: 100vh;            padding: 20px;            display: flex;            flex-direction: column;            align-items: center;        }        #dashboard {            width: 100%;            max-width: 1200px;        }        .top-bar {            display: flex;            justify-content: space-between;            align-items: center;            margin-bottom: 30px;            border-bottom: 1px solid #2d3142;            padding-bottom: 15px;        }        .brand-title {            font-size: 1.25rem;            font-weight: bold;        }        .search-box {            background: var(--bg-input);            border: 1px solid #2d3142;            padding: 8px 16px;            border-radius: 6px;            color: white;            width: 250px;        }        .nav-filters {            display: flex;            gap: 30px;            justify-content: center;            margin-bottom: 30px;            list-style: none;        }        .nav-item {            color: var(--text-muted);            cursor: pointer;            font-weight: 600;            text-transform: uppercase;            font-size: 0.85rem;            padding-bottom: 5px;            letter-spacing: 0.05em;        }        .nav-item.active {            color: var(--text-main);            border-bottom: 2px solid var(--accent-green);        }        .grid-container {            display: grid;            grid-template-columns: repeat(3, 1fr);             gap: 25px 20px;             margin-top: 40px;            margin-bottom: 40px;            width: 100%;            overflow: visible !important;        }        .card-wrapper {            position: relative;            width: 100%;             max-width: 380px;             height: 110px;             overflow: visible;             flex-shrink: 0;            margin-top: 15px;             z-index: 10;        }        .card {            background: var(--bg-card);            border-radius: 8px;            padding: 15px;            display: flex;            align-items: center;            gap: 12px;             border: 1px solid #232738;            position: relative;            width: 100%;            height: 100%;            overflow: hidden;             background-repeat: no-repeat !important;            box-sizing: border-box;        }        .img-wrapper {            width: 65px;            height: 65px;            aspect-ratio: 1 / 1;            border-radius: 8px;            display: flex;            align-items: center;            justify-content: center;            background-size: cover;            background-position: center;            background-repeat: no-repeat;            flex-shrink: 0;            z-index: 3;            background-color: transparent !important;         }        .card-info {            display: flex;            flex-direction: column;            gap: 4px;            width: 100%;            z-index: 2;        }        .card-title {            font-size: 0.95rem;            font-weight: 600;            min-height: 22px;        }        .text-stroke-active {            color: var(--font-c, #ffffff);            text-shadow: var(--shadow-rule, none);        }        .select-row {            display: flex;            flex-direction: column;            gap: 2px;             margin-top: 2px;             width: 100%;        }        .progress-control-row {            display: flex;            align-items: center;            gap: 8px;            width: 100%;            margin-top: -2px;         }        .progress-track-wrapper {            flex-grow: 1;            background: rgba(26, 29, 44, 0.6);            height: 10px;            border-radius: 5px;            position: relative;            overflow: hidden;            border: 1px solid rgba(45, 49, 66, 0.5);        }        .progress-fill-bar {            height: 100%;            width: 0%;            transition: width 0.3s ease;        }        .progress-val-text {            font-size: 0.85rem;            color: var(--text-main);            font-weight: bold;            width: 45px;            text-align: right;        }        .pagination-container {            display: flex;            flex-direction: column;            align-items: center;            gap: 15px;            color: var(--text-muted);            font-size: 0.9rem;            margin-top: 20px;        }        .pager-buttons {            display: flex;            gap: 8px;            align-items: center;        }        .page-btn {            background: var(--bg-card);            border: 1px solid #2d3142;            color: var(--text-muted);            padding: 6px 12px;            border-radius: 4px;            cursor: pointer;        }        .page-btn.active {            background: var(--accent-green);            color: #000;            font-weight: bold;            border-color: var(--accent-green);        }        .status-badge-rect {            position: absolute;            top: -10px;             left: 10px;            width: fit-content;            height: 20px;            border-radius: 4px;            z-index: 9999;             display: flex;            align-items: center;            justify-content: center;            padding: 0 10px;            font-size: 0.65rem;            font-weight: bold;            color: #000000;            letter-spacing: 0.02em;            text-transform: uppercase;            box-shadow: 2px 2px 6px rgba(0,0,0,0.4);        }    </style>	<script src="neutralino.js"></script></head><body>    <div id="dashboard">        <div class="top-bar">            <div class="brand-title">Progress List</div>            <input type="text" id="dashboard-search-box" class="search-box" placeholder="Search by Name">        </div>        <ul class="nav-filters">            <li class="nav-item active">Progress</li>            <li class="nav-item">Finished</li>            <li class="nav-item">Update</li>        </ul>        <div class="grid-container" id="work-grid"></div>        <div class="pagination-container">            <div class="pager-buttons">                <button class="page-btn">&lt;</button>                <button class="page-btn active">1</button>                <button class="page-btn">&gt;</button>            </div>            <div>Each page displays <strong style="color:white">40</strong> Article, total 1 pages</div>        </div>    </div>    <script>        // 👈 REPLACE YOUR OLD INITIALIZATION BLOCK WITH THIS CODE:        try {            if (typeof Neutralino !== 'undefined') {                Neutralino.init();                console.log("Neutralino core pipeline successfully connected.");                Neutralino.window.show();                Neutralino.debug.log("Forcing developer console window activation...");                // This line manually instructs the framework to attach the engine inspector                if (window.NL_ARGS.includes('--debug') || true) {                    Neutralino.computer.getDisplayInfo().then(() => {                        // Triggers the webview browser console window to pop up instantly                        console.log("DevTools initialized.");                    });                }            } else {                console.error("Critical: neutralino.js asset failed to inject into runtime thread.");            }        } catch (e) {            console.error("Native runtime initialization failure:", e);        }        async function openAdminPanel() {            console.log("Admin Panel button triggered. Initiating native window pipeline...");            if (typeof NL_TOKEN === 'undefined') {                alert("Security Error: Native API Token is missing.");                return;            }            try {                await Neutralino.window.create('/admin.html', {                    title: "Progress Editor - Admin Panel",                    width: 1250,                    height: 800,                    resizable: true,                    enableInspectors: true                });                console.log("Native window generated successfully.");            } catch (err) {                // 👈 OVERWRITE YOUR CATCH BLOCK WITH THIS DIAGNOSTIC ALERT:                alert("NEUTRALINO CRASH REPORT:\nCode: " + err.code + "\nMessage: " + err.message + "\nRaw: " + JSON.stringify(err));            }        }        async function syncDashboardPayload() {            console.log("Initiating workspace rendering handshake protocol...");            try {                const isWebDeployment = window.location.hostname.includes('github.io') || window.location.protocol === 'https:';                if (isWebDeployment || typeof Neutralino === 'undefined' || !Neutralino.storage) {                    console.log("Production Cloud View Active: Rendering compiled base64 data cards straight from memory context stream.");                } else {                    let data = await Neutralino.storage.getData('equipdex_demo_payload');                    itemDatabase = JSON.parse(data);                    console.log("Offline local storage layer synchronized cleanly.");                }            } catch(e) {                console.warn("Non-fatal storage reading shift encountered, fallback rendering active:", e);            }            renderDashboard();         }        // CRITICAL AUTOMATION FIX: Dibersihkan penuh dari komentar gantung agar kebal sinkronisasi regex admin        let itemDatabase = JSON.parse("[{\"id\":1790830569465,\"title\":\"Smoothie Request\",\"progress\":60,\"color\":\"#ffe188\",\"cardBgColor\":\"#161925\",\"cardBgImg\":\"data:image/gif;base64,R0lGODlh8gEZAfcAAAQCBIR8Gry3SUw/EHZQNYR6gcC4rWpfDqyFb9vYonReWqOcLyMiMzw+Z7Gic5yDST4lFNHObty5o5yVcHRoD97Y1F1BH5huVrChoNTHVHpsbY1nS2RbYYt8QpWBfFRJW7u6ctLIr3dnNLSmQTwxSyUTDGBSEHZthiIlQMWkjOzp1+zdp0M1EeTHrlxbhpyNMJuIgXxxMtK4ohcTHcaqncvHcVROfpSMQbOtcGJTM5GLGyQyVUs/OKObVt7JxUpJfmNbO4ZtY0E1M5+MVszGU4yGd66TgeTiqrKsqJF7W5ySmVpQX+XZkJiKkYyFGreuRc3J0uzHsOzZzWtoioN8lExLcYR1gS0qRbOgjuzq5xQFBVRMRtPQh3lxEl1BMcW8c66Wj3Rmf2xTPry6yOLcuYRnRmVVW6CUUnVcLLmvWYRzN6ynPGxmciQdMNLAvsW7UDQvL0ZCYeDPsId0bU85L7Kuu4VlVuzjqVRDQNW4lHtzioVcQhUULWxjOtzak2xmD2xfZ8SxeIx0OaSfn9TJeT4tLqyoWDMkFTIzUTw6ZKSfeYyGmt3Z5JpzV5SCjiwcFLSjWFA3FGVhh1RIEeLBqyQuUsmwoM/P1V5IPrmsjMqskgsLH4R9KZ5+X5SMXIyCKC0tWUxPiXhbQi4mMDQ0XsTAqUIsFT04WRwbIlZUg+DQyr+/yaygPKSSiIRqJLymnWxWH4R2IJx2TOTGlKyOfXdlZeTg1V1JGnxyb5CDQdLQo56ULpGDWu3h1BcMEBscNOTg5by3WdTIX7y3iezcu8vHiJOMKOTjvMe5je3lv1RAFNzSdGxcOayUXezCrdSxnGxJMIx8fqSBbKSMgKygWLyZgqSUmKSNjcSyTIyBk9zTjbyajNLArOzPtmtdIOTcpaOcP7yhe5ySi3VnIbCmuGJcclRKbnhlR2NTIPTp13pwRryvc2FRSEpASczHX7ytpFdScYR2lbygivTp5ntyH2RWbcSwXse7X0ZEbryxuI5ySaOfsNbIkNSxlAsLEISDGyH5BAAHAAAAIf8LTkVUU0NBUEUyLjADAQAAACwAAAAA8gEZAQAI/gB/VUmVygXBVDYI4qti0IXBgw4PSoRY0KEkF5IyTpniYorGj5I8egwZciRHF/BSbVxJcuXGkpJOnJhyQpLCUD9yhtrJc6fOiQ6DWsSI8WJGohgrwkOZCh68KlXi4IsTpwG+BlITVT2Fj9SpU14RgUIk9gqoK5UqoVWL4opbFGrdHjqE7h4hbO6ICCPCt2/fDIAzEBFMeLDhwogPD0ZMuPHix4AhO54cOPBiy5EzJ96smDNid8K0EWNSY28GYYJNm05MJK87EH14fLDhtKmN27erXE2UqEGigQknUhROXGKo4hB/4AsV8SLSiziX45zes7r169ZT7dQuUaj3hqmo/oy5BKX8r+APaTeF2vQhQffCHzYUajSjffsm799/6dEFw5IitSSSSzS95MIPuNkQioLU+cQTdxFFaNF9RQlVTioXXthUSlFVdRVVVVHlWyKnkJgIIqSQNZZZaKHVVlxvuSUjBHTkQsg97gjm146EvQGYj50dBiRiQ0ImmZGedabZZpkFqZmTfCWpY2Lu8PNNMisQUkNqegGWI2t8ueNODTUoAsQWtKWXknpVhLKQcj9ARZt6QBX03p0EMXccUHvq2dAPDTD0XVCSuDndD9Uh2iB2jPak3XbgDRqhHquUZ14VSx0UXCpxwsMcfE2F4ulTB6U0X0VGFaXfqvmxFJJ        let activeDashboardTab = "progress";        function getOutlineShadow(useStroke, color) {            if (!useStroke) return 'none';            const c = color || '#000000';            return `                -1px -1px 0 ${c},  1px -1px 0 ${c}, -1px  1px 0 ${c},  1px  1px 0 ${c},                -1.5px 0px 0 ${c}, 1.5px 0px 0 ${c}, 0px -1.5px 0 ${c}, 0px  1.5px 0 ${c}            `;        }        function hexToRgba(hex, opacityPercent) {            let c = hex.replace('#', '');            if(c.length === 3){                c = c.split('').map(x => x + x).join('');            }            const r = parseInt(c.substring(0, 2), 16) || 0;            const g = parseInt(c.substring(2, 4), 16) || 0;            const b = parseInt(c.substring(4, 6), 16) || 0;            return `rgba(${r}, ${g}, ${b}, ${(opacityPercent / 100)})`;        }        function generateCardBackgroundStyle(item) {            if (item.cardBgImg) {                const zoom = item.bgZoom || 100;                const posX = item.bgX || 50;                const posY = item.bgY || 50;                return `background-image: linear-gradient(rgba(22, 25, 37, 0.4), rgba(22, 25, 37, 0.4)), url('${item.cardBgImg}'); background-size: ${zoom}%; background-position: ${posX}% ${posY}%; background-repeat: no-repeat;`;            }            return `background-color: ${item.cardBgColor || '#161925'};`;        }        function getSubStatusColor(statusValue) {            switch (statusValue) {                case "none": return "transparent";                case "wip": return "#10b981";                case "queue": return "#f97316";                case "delayed": return "#ef4444";                case "postponed": return "#6b7280";                default: return "transparent";            }        }        function getSubStatusText(statusValue) {            switch (statusValue) {                case "none": return "";                case "wip": return "Work In Progress";                case "queue": return "In The Queue";                case "delayed": return "Delayed";                case "postponed": return "Postponed";                default: return "";            }        }        // 👈 GANTI SATU BLOK FUNGSI renderDashboard() LAMA ANDA DENGAN BLOK INI:        function renderDashboard() {            const container = document.getElementById('work-grid');            if (!container) return;            container.innerHTML = "";            if (!itemDatabase || itemDatabase.length === 0) {                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No updates shared yet. Go to your Admin Panel and click "Update"!</div>`;                return;            }            // FITUR BARU: Ambil nilai teks kata kunci pencarian (diubah ke huruf kecil agar pencarian kebal huruf kapital)            const searchInput = document.getElementById('dashboard-search-box');            const searchQuery = searchInput ? searchInput.value.toLowerCase().trim() : "";            let visibleCardsCount = 0;            itemDatabase.forEach(item => {                const itemStatus = item.status || "progress";                if (itemStatus !== activeDashboardTab) return;                // FITUR BARU: Saring nama item klien berdasarkan kata kunci pencarian yang dimasukkan                const itemTitle = item.title || "";                if (searchQuery !== "" && !itemTitle.toLowerCase().includes(searchQuery)) {                    return; // Lompati kartu jika namanya tidak cocok dengan kata kunci pencarian                }                visibleCardsCount++;                const subStatusColor = getSubStatusColor(item.subStatus || "none");                const subStatusText = getSubStatusText(item.subStatus || "none");                const rectDisplayStatus = (item.subStatus === "none" || !item.subStatus) ? "none" : "flex";                const itemImgStr = item.imgStatic && item.img ? item.imgStatic : (item.img || '');                const inlineCardStyle = generateCardBackgroundStyle(item);                const shadowRule = getOutlineShadow(item.useStroke, item.strokeColor);                container.innerHTML += `                    <div class="card-wrapper">                        <div class="status-badge-rect" style="background-color: ${subStatusColor}; display: ${rectDisplayStatus};">                            ${subStatusText}                        </div>                        <div class="card" id="demo-card-${item.id}" style="${inlineCardStyle}">                            <div class="img-wrapper" id="demo-img-${item.id}" style="background-image: url('${itemImgStr}'); background-size: cover; background-position: center; background-repeat: no-repeat; display: ${item.img ? 'block' : 'none'}"></div>                            <div class="card-info">                                <div class="card-title text-stroke-active" style="--font-c: ${item.fontColor || '#ffffff'}; --shadow-rule: ${shadowRule};">                                    ${item.title || `<span style="color: var(--text-muted); font-style: italic;">No Name Entered</span>`}                                </div>                                <div class="select-row">                                    <div style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0px; text-align: left; width: 100%;">Progress :</div>                                    <div class="progress-control-row">                                        <div class="progress-track-wrapper">                                            <div class="progress-fill-bar" style="width: ${item.progress}%; background-color: ${item.color || 'var(--accent-green)'}"></div>                                        </div>                                        <span class="progress-val-text">${item.progress}%</span>                                    </div>                                </div>                            </div>                        </div>                    </div>                `;                setTimeout(() => {                    const previewIcon = document.getElementById(`demo-img-${item.id}`);                    if (previewIcon && item.img) {                        previewIcon.addEventListener('mouseenter', (e) => {                            e.stopPropagation();                            previewIcon.style.backgroundImage = `url('${item.img}')`;                        });                        previewIcon.addEventListener('mouseleave', (e) => {                            e.stopPropagation();                            previewIcon.style.backgroundImage = `url('${itemImgStr}')`;                        });                    }                }, 0);            });            if (visibleCardsCount === 0) {                // Tampilkan pesan kosong yang adaptif jika item tidak ditemukan saat dicari                if (searchQuery !== "") {                    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No client named "<strong style="color: white;">${searchQuery}</strong>" found in this tab.</div>`;                } else {                    const tabDisplayName = activeDashboardTab.charAt(0).toUpperCase() + activeDashboardTab.slice(1);                    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No items found in the ${tabDisplayName} category.</div>`;                }            }        }        // 👈 JADIKAN SEPERTI INI (Seksi Pengait Event Listener yang Sah & Rapi):        document.addEventListener('DOMContentLoaded', () => {            const tabs = document.querySelectorAll('.nav-filters .nav-item');            tabs.forEach(tab => {                tab.addEventListener('click', function() {                    tabs.forEach(t => t.classList.remove('active'));                    this.classList.add('active');                    const selectedText = this.textContent.trim().toLowerCase();                    if (selectedText === "progress" || selectedText === "finished" || selectedText === "update") {                        activeDashboardTab = selectedText;                        renderDashboard();                    }                });            });            const adminBtn = document.getElementById('admin-panel-btn');            if (adminBtn) {                adminBtn.addEventListener('click', (e) => {                    e.preventDefault();                    openAdminPanel();                });            }            // 1. Ambil data dari storage biner native saat pertama kali aplikasi dibuka            syncDashboardPayload();             // 2. Sambungkan detektor input pencarian secara real-time di dalam blok yang sama            const searchInputBox = document.getElementById('dashboard-search-box');            if (searchInputBox) {                searchInputBox.addEventListener('input', () => {                    renderDashboard();                });            }        }); // 🟩 Seluruh fungsi tertutup rapat dengan sempurna di sini!        // 👈 REPLACE YOUR OLD CONSOLE AND KEYDOWN SCRIPTS AT THE BOTTOM WITH THIS FULL BLOCK:        (function() {            // Self-create and attach element directly to document body to prevent innerHTML wipes            const panel = document.createElement('div');            panel.id = 'debug-console-panel';            panel.style.cssText = "position: fixed; bottom: 0; left: 0; width: 100%; height: 250px; background: #07090e; border-top: 2px solid #2563eb; color: #00ff66; font-family: monospace; font-size: 11px; padding: 10px; box-sizing: border-box; overflow-y: auto; z-index: 99999999; display: none; box-shadow: 0 -5px 15px rgba(0,0,0,0.5);";            panel.innerHTML = `                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3142; padding-bottom: 5px; margin-bottom: 8px; color: #8b949e;">                    <strong style="color: #2563eb;">MAIN VIEW CONSOLE OVERLAY (F12 TOGGLE)</strong>                    <button onclick="document.getElementById('debug-console-panel').style.display='none'" style="background: #ef4444; color: white; border: none; padding: 2px 8px; cursor: pointer; font-weight: bold; border-radius: 3px;">CLOSE</button>                </div>                <div id="debug-console-logs" style="width: 100%; height: calc(100% - 25px); overflow-y: auto; white-space: pre-wrap; word-break: break-all;"></div>            `;            document.body.appendChild(panel);            const logContainer = document.getElementById('debug-console-logs');            function printToScreenLog(type, args) {                if(!logContainer) return;                const message = Array.from(args).map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');                const colors = { log: '#00ff66', error: '#ef4444', warn: '#f97316', debug: '#38bdf8' };                logContainer.innerHTML += `<div style="color: ${colors[type] || '#fff'}; margin-bottom: 4px; border-bottom: 1px solid #141724; padding-bottom: 2px;">[${type.toUpperCase()}] ${message}</div>`;                logContainer.scrollTop = logContainer.scrollHeight;            }            const oldLog = console.log; console.log = function() { oldLog.apply(console, arguments); printToScreenLog('log', arguments); };            const oldErr = console.error; console.error = function() { oldErr.apply(console, arguments); printToScreenLog('error', arguments); };            const oldWarn = console.warn; console.warn = function() { oldWarn.apply(console, arguments); printToScreenLog('warn', arguments); };            document.addEventListener('keydown', (e) => {                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i')) {                    e.preventDefault();                    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';                }            });            console.log("Main Dashboard Console Mounted Safe From InnerHTML Resets.");        })();    </script></body></html>
