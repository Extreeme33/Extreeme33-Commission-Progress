<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress List - Demo View</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #161925;
            --bg-input: #1a1d2c;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --accent-green: #10b981;
            --accent-orange: #f97316;
            --accent-purple: #a855f7;
            --star-gold: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #dashboard {
            width: 100%;
            max-width: 1200px;
        }

        /* Top Navbar Elements */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #2d3142;
            padding-bottom: 15px;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .search-box {
            background: var(--bg-input);
            border: 1px solid #2d3142;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            width: 250px;
        }

        /* Filter Categories System */
        .nav-filters {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 30px;
            list-style: none;
        }

        .nav-item {
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            padding-bottom: 5px;
            letter-spacing: 0.05em;
        }

        .nav-item.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-green);
        }

        /* Responsive Grid Framework with locked sizes */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #232738;
            position: relative;
            width: 350px;
            height: 110px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Square Preview Profile Box */
        .img-wrapper {
            width: 65px;
            height: 65px;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            flex-shrink: 0;
            z-index: 3;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            z-index: 2;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 22px;
        }

        .text-stroke-active {
            color: var(--font-c, #ffffff);
            text-shadow: var(--shadow-rule, none);
        }

        .select-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
            width: 100%;
        }

        .progress-control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .progress-track-wrapper {
            flex-grow: 1;
            background: rgba(26, 29, 44, 0.6);
            height: 10px;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(45, 49, 66, 0.5);
        }

        .progress-fill-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-val-text {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: bold;
            width: 45px;
            text-align: right;
        }

        .pagination-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .pager-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .page-btn {
            background: var(--bg-card);
            border: 1px solid #2d3142;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .page-btn.active {
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-green);
        }
    </style>
	<script src="neutralino.js"></script>
</head>
<body>

    <div id="dashboard">
        <div class="top-bar">
            <div class="brand-title">Progress List</div>
            <input type="text" class="search-box" placeholder="Search by name, ID, or type...">
			<button id="admin-panel-btn" style="background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">Admin Panel</button>
        </div>

        <ul class="nav-filters">
            <li class="nav-item active">Progress</li>
            <li class="nav-item">Finished</li>
            <li class="nav-item">Update</li>
        </ul>

        <div class="grid-container" id="work-grid"></div>

        <div class="pagination-container">
            <div class="pager-buttons">
                <button class="page-btn">&lt;</button>
                <button class="page-btn active">1</button>
                <button class="page-btn">&gt;</button>
            </div>
            <div>Each page displays <strong style="color:white">40</strong> Article, total 1 pages</div>
        </div>
    </div>

        let activeDashboardTab = "progress";

        function getOutlineShadow(useStroke, color) {
            if (!useStroke) return 'none';
            const c = color || '#000000';
            return `
                -1px -1px 0 ${c},  1px -1px 0 ${c}, -1px  1px 0 ${c},  1px  1px 0 ${c},
                -1.5px 0px 0 ${c}, 1.5px 0px 0 ${c}, 0px -1.5px 0 ${c}, 0px  1.5px 0 ${c}
            `;
        }

        function hexToRgba(hex, opacityPercent) {
            let c = hex.replace('#', '');
            if(c.length === 3){
                c = c.split('').map(x => x + x).join('');
            }
            const r = parseInt(c.substring(0, 2), 16) || 0;
            const g = parseInt(c.substring(2, 4), 16) || 0;
            const b = parseInt(c.substring(4, 6), 16) || 0;
            return `rgba(${r}, ${g}, ${b}, ${(opacityPercent / 100)})`;
        }

        function generateCardBackgroundStyle(item) {
            if (item.cardBgImg) {
                const zoom = item.bgZoom || 100;
                const posX = item.bgX || 50;
                const posY = item.bgY || 50;
                return `background-image: linear-gradient(rgba(22, 25, 37, 0.4), rgba(22, 25, 37, 0.4)), url('${item.cardBgImg}'); background-size: ${zoom}%; background-position: ${posX}% ${posY}%; background-repeat: no-repeat;`;
            }
            return `background-color: ${item.cardBgColor || '#161925'};`;
        }
        
        // 👈 REPLACE YOUR OLD renderDashboard() FUNCTION BLOCK WITH THIS:
        function renderDashboard() {
            const container = document.getElementById('work-grid');
            if (!container) return;
            container.innerHTML = "";

            // 1. Initial database validation check
            if (!itemDatabase || itemDatabase.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No updates shared yet. Go to your Admin Panel and click "Update"!</div>`;
                return;
            }

            // 2. Track how many cards match our active viewport tab criteria
            let visibleCardsCount = 0;

            itemDatabase.forEach(item => {
                const itemStatus = item.status || "progress";
                if (itemStatus !== activeDashboardTab) return;
                
                // Increment our matched display counter tracking flag
                visibleCardsCount++;

                const itemImgStr = item.imgStatic && item.img ? item.imgStatic : (item.img || '');
                const inlineCardStyle = generateCardBackgroundStyle(item);
                const shadowRule = getOutlineShadow(item.useStroke, item.strokeColor);

                container.innerHTML += `
                    <div class="card" id="demo-card-${item.id}" style="${inlineCardStyle}">
                        <div class="img-wrapper" id="demo-img-${item.id}" style="background-image: url('${itemImgStr}'); background-size: cover; background-position: center; background-repeat: no-repeat; display: ${item.img ? 'block' : 'none'}"></div>
                        <div class="card-info">
                            <div class="card-title text-stroke-active" style="--font-c: ${item.fontColor || '#ffffff'}; --shadow-rule: ${shadowRule};">
                                ${item.title || `<span style="color: var(--text-muted); font-style: italic;">No Name Entered</span>`}
                            </div>
                            <div class="select-row">
                                <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; text-align: left; width: 100%;">Progress :</div>
                                <div class="progress-control-row">
                                    <div class="progress-track-wrapper">
                                        <div class="progress-fill-bar" style="width: ${item.progress}%; background-color: ${item.color || 'var(--accent-green)'}"></div>
                                    </div>
                                    <span class="progress-val-text">${item.progress}%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                setTimeout(() => {
                    const previewIcon = document.getElementById(`demo-img-${item.id}`);
                    if (previewIcon && item.img) {
                        previewIcon.addEventListener('mouseenter', (e) => {
                            e.stopPropagation();
                            previewIcon.style.backgroundImage = `url('${item.img}')`;
                        });
                        previewIcon.addEventListener('mouseleave', (e) => {
                            e.stopPropagation();
                            previewIcon.style.backgroundImage = `url('${itemImgStr}')`;
                        });
                    }
                }, 0);
            });

            // 3. Dynamic layout empty fallback if no items match the current category tab
            if (visibleCardsCount === 0) {
                const tabDisplayName = activeDashboardTab.charAt(0).toUpperCase() + activeDashboardTab.slice(1);
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No items found in the ${tabDisplayName} category.</div>`;
            }
        }

        // 👈 PASTIKAN BLOK INI TERPASANG DENGAN DOMContentLoaded YANG BENAR:
        document.addEventListener('DOMContentLoaded', () => {
            // Unfreeze tabs functionality
            const tabs = document.querySelectorAll('.nav-filters .nav-item');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
					
                    const selectedText = this.textContent.trim().toLowerCase();
                    
                    // Route tab categorization screening paths safely
                    if (selectedText === "progress" || selectedText === "finished" || selectedText === "update") {
                        activeDashboardTab = selectedText;
                        renderDashboard(); // Re-renders the display grid with filtered layout items instantly
                    }
                });
            });

            // Set up Admin Panel button click trigger safely
            const adminBtn = document.getElementById('admin-panel-btn');
            if (adminBtn) {
                adminBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    openAdminPanel();
                });
            }

            // Ambil data dari storage biner native saat pertama kali aplikasi dibuka
            syncDashboardPayload(); 
        });

        // 👈 REPLACE YOUR OLD CONSOLE AND KEYDOWN SCRIPTS AT THE BOTTOM WITH THIS FULL BLOCK:
        (function() {
            // Self-create and attach element directly to document body to prevent innerHTML wipes
            const panel = document.createElement('div');
            panel.id = 'debug-console-panel';
            panel.style.cssText = "position: fixed; bottom: 0; left: 0; width: 100%; height: 250px; background: #07090e; border-top: 2px solid #2563eb; color: #00ff66; font-family: monospace; font-size: 11px; padding: 10px; box-sizing: border-box; overflow-y: auto; z-index: 99999999; display: none; box-shadow: 0 -5px 15px rgba(0,0,0,0.5);";
            
            panel.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3142; padding-bottom: 5px; margin-bottom: 8px; color: #8b949e;">
                    <strong style="color: #2563eb;">MAIN VIEW CONSOLE OVERLAY (F12 TOGGLE)</strong>
                    <button onclick="document.getElementById('debug-console-panel').style.display='none'" style="background: #ef4444; color: white; border: none; padding: 2px 8px; cursor: pointer; font-weight: bold; border-radius: 3px;">CLOSE</button>
                </div>
                <div id="debug-console-logs" style="width: 100%; height: calc(100% - 25px); overflow-y: auto; white-space: pre-wrap; word-break: break-all;"></div>
            `;
            document.body.appendChild(panel);

            const logContainer = document.getElementById('debug-console-logs');
            function printToScreenLog(type, args) {
                if(!logContainer) return;
                const message = Array.from(args).map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
                const colors = { log: '#00ff66', error: '#ef4444', warn: '#f97316', debug: '#38bdf8' };
                logContainer.innerHTML += `<div style="color: ${colors[type] || '#fff'}; margin-bottom: 4px; border-bottom: 1px solid #141724; padding-bottom: 2px;">[${type.toUpperCase()}] ${message}</div>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            const oldLog = console.log; console.log = function() { oldLog.apply(console, arguments); printToScreenLog('log', arguments); };
            const oldErr = console.error; console.error = function() { oldErr.apply(console, arguments); printToScreenLog('error', arguments); };
            const oldWarn = console.warn; console.warn = function() { oldWarn.apply(console, arguments); printToScreenLog('warn', arguments); };
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i')) {
                    e.preventDefault();
                    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                }
            });
            console.log("Main Dashboard Console Mounted Safe From InnerHTML Resets.");
        })();
		
    </script>
</body>
