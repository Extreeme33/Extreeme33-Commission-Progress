    <script>
    /* HQThumbs: high-quality previews for heavy line-art / halftone images.
       Browsers downscale big images in one step, which aliases halftone dots into
       moire/noise. This re-samples each preview to its real on-screen size using
       progressive halving (area-average), so dots blend into clean tones. */
    (function () {
        'use strict';
        var SEL = '.matrix-thumb-box, .lightbox-thumb-item';
        var cache = new Map();   // src|width -> Promise<blobUrl>
        var dims = new Map();    // src -> {w, h}
        var queue = [], active = 0, MAX_ACTIVE = 2;

        function pump() {
            while (active < MAX_ACTIVE && queue.length) {
                var job = queue.shift();
                active++;
                job().catch(function () {}).then(function () { active--; pump(); });
            }
        }
        function enqueue(job) { queue.push(job); pump(); }

        function urlOf(el) {
            var s = (el.style.backgroundImage || '').trim();
            if (s.indexOf('url(') !== 0) return null;
            s = s.slice(4, -1).trim();
            if (s.charAt(0) === '"' || s.charAt(0) === "'") s = s.slice(1, -1);
            return s || null;
        }
        function load(src) {
            return new Promise(function (resolve, reject) {
                var im = new Image();
                im.decoding = 'async';
                im.onload = function () { resolve(im); };
                im.onerror = reject;
                im.src = src;
            });
        }
        function makeThumb(im, tw, th) {
            var cur = im, cw = im.naturalWidth, ch = im.naturalHeight;
            while (cw > tw * 2) {                       // halve until within 2x of target
                var nw = Math.ceil(cw / 2), nh = Math.ceil(ch / 2);
                var c = document.createElement('canvas');
                c.width = nw; c.height = nh;
                var x = c.getContext('2d');
                x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
                x.drawImage(cur, 0, 0, nw, nh);
                cur = c; cw = nw; ch = nh;
            }
            var out = document.createElement('canvas');
            out.width = tw; out.height = th;
            var ox = out.getContext('2d');
            ox.imageSmoothingEnabled = true; ox.imageSmoothingQuality = 'high';
            ox.drawImage(cur, 0, 0, tw, th);
            return new Promise(function (resolve, reject) {
                out.toBlob(function (b) { b ? resolve(URL.createObjectURL(b)) : reject(new Error('toBlob')); }, 'image/webp', 0.95);
            });
        }
        function getThumb(src, im, tw, th) {
            var key = src + '|' + tw;
            var p = cache.get(key);
            if (!p) {
                p = (im ? Promise.resolve(im) : load(src)).then(function (i) { return makeThumb(i, tw, th); });
                p.catch(function () { cache.delete(key); });
                cache.set(key, p);
            }
            return p;
        }
        function bucket(w, s) { return Math.min(w, Math.ceil(w * s / 64) * 64); }
        function dpr() { return Math.min(window.devicePixelRatio || 1, 2.5); }

        function restore(el) {
            if (el.__hqSrc) el.style.backgroundImage = "url('" + el.__hqSrc + "')";
            el.__hqState = 'orig';
        }
        function render(el) {
            var src = el.__hqSrc;
            if (!el.isConnected) return Promise.resolve();
            var r = el.getBoundingClientRect();
            if (!r.width || !r.height) { restore(el); el.__hqState = 'retry'; return Promise.resolve(); }
            var contain = (getComputedStyle(el).backgroundSize || '').indexOf('contain') >= 0;
            var im = null;
            var d = dims.get(src);
            var step = d ? Promise.resolve(d) : load(src).then(function (i) {
                im = i; d = { w: i.naturalWidth, h: i.naturalHeight }; dims.set(src, d); return d;
            });
            return step.then(function (d) {
                if (!el.isConnected) return;
                var s = (contain ? Math.min(r.width / d.w, r.height / d.h) : Math.max(r.width / d.w, r.height / d.h)) * dpr();

                    if (!el.isConnected) return;

        }
        function scan() {
            var list = document.querySelectorAll(SEL);
            for (var i = 0; i < list.length; i++) {
                var el = list[i];
                if (el.__hqState === 'retry' || el.__hqState === undefined) {

                        if (!src) { el.__hqState = 'skip'; continue; }

                    (function (e) { enqueue(function () { return render(e); }); })(el);

        function start() {
            obs.observe(document.body, { childList: true, subtree: true });

        }
        if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);

        var rt;
        window.addEventListener('resize', function () {
            clearTimeout(rt);
            rt = setTimeout(function () {
                var list = document.querySelectorAll(SEL);
                for (var i = 0; i < list.length; i++) {
                    var e = list[i];
                    if (e.__hqSrc && (e.__hqState === 'done' || e.__hqState === 'orig')) {
                        e.__hqState = 'pending';
                        (function (x) { enqueue(function () { return render(x); }); })(e);
                    }
                }
            }, 250);
        });

        // Lightbox main image: swap in a version sized for the screen (incl. the 1.5x zoom).
        function upgradeLightbox(img, src) {
            if (!img || !src) return;
            var tok = img.__hqTok = (img.__hqTok || 0) + 1;
            var im = null;
            var ready = img.decode ? img.decode().catch(function () {}) : Promise.resolve();
            ready.then(function () {
                if (img.__hqTok !== tok || !img.naturalWidth) return;
                var r = img.getBoundingClientRect();
                if (!r.width) return;
                var nw = img.naturalWidth, nh = img.naturalHeight;
                var s = (r.width / nw) * dpr() * 1.5;
                if (s >= 0.85) return;
                var tw = bucket(nw, s), th = Math.max(1, Math.round(nh * tw / nw));
                return getThumb(src, null, tw, th).then(function (url) {
                    if (img.__hqTok !== tok) return;
                    img.src = url;
                });
            }).catch(function () {});
        }
        window.HQThumbs = { upgradeLightbox: upgradeLightbox, rescan: scan };
    })();
